<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Essential for iOS PWA: viewport-fit=cover handles the notch/safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0B1120">
    <title>Nexus Flight Log</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* iOS specifics and smooth transitions */
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            background-color: #0B1120;
        }
        /* Prevent iOS input zoom by forcing 16px */
        input[type="text"], input[type="date"], input[type="number"] {
            font-size: 16px !important;
        }
        .modal-enter {
            transform: translateY(0%);
        }
        .modal-leave {
            transform: translateY(100%);
        }
        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="text-slate-300 font-sans min-h-screen selection:bg-indigo-500/30 overflow-x-hidden pt-[var(--safe-top)] pb-[var(--safe-bottom)]">

    <!-- Top Navigation Bar -->
    <nav class="sticky top-[var(--safe-top)] left-0 right-0 z-30 bg-[#0B1120]/80 backdrop-blur-xl border-b border-slate-800/80 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-teal-400">Nexus Log</h1>
        
        <div class="flex items-center gap-3">
            <button onclick="exportCSV()" class="p-2 text-teal-400 active:scale-95 transition-transform" aria-label="Export CSV">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </button>
            <label for="csvFileInput" class="p-2 text-indigo-400 active:scale-95 transition-transform cursor-pointer" aria-label="Import CSV">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            </label>
            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="importCSV(event)">
        </div>
    </nav>

    <!-- Main Content: Flight List -->
    <main class="px-4 py-6 mb-24" id="mainContent">
        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center p-8 mt-12 text-slate-500">
            <div class="w-20 h-20 mb-4 rounded-3xl bg-[#111827] flex items-center justify-center border border-slate-700/50 shadow-inner">
                <svg class="w-10 h-10 text-indigo-400/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <p class="text-base font-semibold text-slate-300">No telemetry data</p>
            <p class="text-sm mt-1 text-slate-500 text-center">Tap the + button to log a flight or import a dataset.</p>
        </div>

        <div id="flightList" class="space-y-4">
            <!-- Cards generated by JS -->
        </div>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button onclick="openForm()" class="fixed bottom-8 right-4 z-20 w-14 h-14 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-full shadow-lg shadow-indigo-500/30 flex items-center justify-center text-white active:scale-90 transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <!-- Slide-up Modal Form (iOS Style) -->
    <div id="formModalOverlay" class="fixed inset-0 bg-black/60 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeForm()"></div>
    
    <div id="formModal" class="fixed inset-x-0 bottom-0 z-50 bg-[#111827] rounded-t-3xl border-t border-slate-700/50 modal-leave transition-transform duration-300 ease-[cubic-bezier(0.32,0.72,0,1)] pt-2 pb-[var(--safe-bottom)] flex flex-col max-h-[90vh]">
        <!-- Grabber handle -->
        <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-4 mt-2"></div>
        
        <div class="px-6 pb-4 flex justify-between items-center border-b border-slate-800/80 shrink-0">
            <h2 id="formTitle" class="text-lg font-bold text-white">Log Flight</h2>
            <button type="button" onclick="closeForm()" class="text-slate-400 font-medium text-sm px-2 py-1 active:text-white">Cancel</button>
        </div>

        <div class="overflow-y-auto px-6 py-5 space-y-5">
            <form id="flightForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="flightId">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Flight Number</label>
                        <input type="text" id="flightNumber" required placeholder="e.g., QF1" 
                            class="w-full bg-[#0B1120] rounded-xl border border-slate-700/50 px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder-slate-600">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Date</label>
                            <input type="date" id="flightDate" required onchange="document.getElementById('flightYear').value = this.value.split('-')[0]"
                                class="w-full bg-[#0B1120] rounded-xl border border-slate-700/50 px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all [color-scheme:dark]">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Year</label>
                            <input type="number" id="flightYear" required placeholder="YYYY" 
                                class="w-full bg-[#0B1120] rounded-xl border border-slate-700/50 px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder-slate-600">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Aircraft Reg</label>
                        <input type="text" id="aircraftReg" required placeholder="e.g., VH-OQA" 
                            class="w-full bg-[#0B1120] rounded-xl border border-slate-700/50 px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder-slate-600">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Seat</label>
                        <input type="text" id="seat" required placeholder="e.g., 3A" 
                            class="w-full bg-[#0B1120] rounded-xl border border-slate-700/50 px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder-slate-600">
                    </div>
                </div>

                <div class="mt-8 pb-4">
                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-500/25 active:scale-[0.98] transition-all">
                        Save Flight
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast (iOS Pill style) -->
    <div id="toast" class="fixed top-[max(1rem,var(--safe-top))] left-1/2 -translate-x-1/2 transform transition-all duration-300 -translate-y-20 opacity-0 bg-slate-800/90 backdrop-blur-md border border-slate-700 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium flex items-center gap-3 pointer-events-none z-[60]">
        <div class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></div>
        <span id="toastMessage">Updated</span>
    </div>

    <script>
        // State management
        let flights = [];
        
        // DOM Elements
        const form = document.getElementById('flightForm');
        const flightListContainer = document.getElementById('flightList');
        const emptyState = document.getElementById('emptyState');
        const submitBtn = document.getElementById('submitBtn');
        const formTitle = document.getElementById('formTitle');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const modal = document.getElementById('formModal');
        const modalOverlay = document.getElementById('formModalOverlay');

        // Initialize from local storage
        window.onload = () => {
            const savedFlights = localStorage.getItem('flightLogData');
            if (savedFlights) {
                try {
                    flights = JSON.parse(savedFlights);
                } catch (e) {
                    console.error("Error parsing saved flights", e);
                }
            }
            renderList();
        };

        function saveToLocalStorage() {
            localStorage.setItem('flightLogData', JSON.stringify(flights));
        }

        // iOS Style Toast Notification
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Modal Controls
        function openForm() {
            form.reset();
            document.getElementById('flightId').value = '';
            formTitle.textContent = 'Log Flight';
            submitBtn.textContent = 'Save Flight';
            
            modalOverlay.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity/transform
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modal.classList.remove('modal-leave');
                modal.classList.add('modal-enter');
            }, 10);
        }

        function closeForm() {
            modal.classList.remove('modal-enter');
            modal.classList.add('modal-leave');
            modalOverlay.classList.add('opacity-0');
            
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
            }, 300);
            
            // Unfocus inputs to close keyboard on iOS
            document.activeElement.blur();
        }

        // Form Submission
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('flightId').value;
            const flightNumber = document.getElementById('flightNumber').value.trim();
            const date = document.getElementById('flightDate').value;
            const year = document.getElementById('flightYear').value;
            const aircraftReg = document.getElementById('aircraftReg').value.trim();
            const seat = document.getElementById('seat').value.trim();

            if (id) {
                // Update
                const index = flights.findIndex(f => f.id === id);
                if (index !== -1) {
                    flights[index] = { id, flightNumber, date, year, aircraftReg, seat };
                    showToast('Flight updated');
                }
            } else {
                // Add new
                const newFlight = {
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    flightNumber,
                    date,
                    year,
                    aircraftReg,
                    seat
                };
                flights.unshift(newFlight);
                showToast('Flight logged');
            }

            saveToLocalStorage();
            renderList();
            closeForm();
        }

        function editFlight(id) {
            const flight = flights.find(f => f.id === id);
            if (!flight) return;

            document.getElementById('flightId').value = flight.id;
            document.getElementById('flightNumber').value = flight.flightNumber;
            document.getElementById('flightDate').value = flight.date;
            document.getElementById('flightYear').value = flight.year || '';
            document.getElementById('aircraftReg').value = flight.aircraftReg;
            document.getElementById('seat').value = flight.seat;

            formTitle.textContent = 'Edit Flight';
            submitBtn.textContent = 'Update Flight';
            
            modalOverlay.classList.remove('hidden');
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modal.classList.remove('modal-leave');
                modal.classList.add('modal-enter');
            }, 10);
        }

        function deleteFlight(id) {
            if (confirm('Delete this flight?')) {
                flights = flights.filter(f => f.id !== id);
                saveToLocalStorage();
                renderList();
                showToast('Deleted');
            }
        }

        // Render iOS Style Cards
        function renderList() {
            flightListContainer.innerHTML = '';
            
            if (flights.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            flights.forEach(flight => {
                const card = document.createElement('div');
                card.className = 'bg-[#111827] rounded-2xl border border-slate-800/80 p-4 shadow-sm relative overflow-hidden active:bg-[#1E293B] transition-colors';
                
                let displayDate = flight.date;
                try {
                    const d = new Date(flight.date);
                    if(!isNaN(d)) {
                       displayDate = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                    }
                } catch(e) {}

                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-indigo-500 to-purple-500"></div>
                    <div class="flex justify-between items-start ml-2">
                        <div>
                            <h3 class="text-xl font-bold text-white tracking-tight">${escapeHtml(flight.flightNumber)}</h3>
                            <p class="text-sm text-slate-400 mt-0.5">${escapeHtml(displayDate)}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editFlight('${flight.id}')" class="p-2 -m-2 text-indigo-400" aria-label="Edit">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            </button>
                            <button onclick="deleteFlight('${flight.id}')" class="p-2 -m-2 text-red-400 ml-1" aria-label="Delete">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mt-4 flex flex-wrap gap-2 ml-2">
                        <div class="px-2.5 py-1 rounded-lg bg-[#0B1120] border border-slate-700/50 flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span class="text-xs font-mono text-slate-300">${escapeHtml(flight.aircraftReg)}</span>
                        </div>
                        <div class="px-2.5 py-1 rounded-lg bg-[#0B1120] border border-slate-700/50 flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                            <span class="text-xs font-semibold text-slate-300">Seat ${escapeHtml(flight.seat)}</span>
                        </div>
                    </div>
                `;
                flightListContainer.appendChild(card);
            });
        }

        // Export data to CSV
        function exportCSV() {
            if (flights.length === 0) {
                showToast('No data to export');
                return;
            }

            const headers = ['Flight Number', 'Date', 'Year', 'Aircraft Registration', 'Seat'];
            const csvRows = [headers.join(',')];

            flights.forEach(f => {
                const row = [
                    `"${f.flightNumber.replace(/"/g, '""')}"`,
                    `"${f.date.replace(/"/g, '""')}"`,
                    `"${(f.year || '').toString().replace(/"/g, '""')}"`,
                    `"${f.aircraftReg.replace(/"/g, '""')}"`,
                    `"${f.seat.replace(/"/g, '""')}"`
                ];
                csvRows.push(row.join(','));
            });

            const csvString = csvRows.join('\n');
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `flight_log_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('Exported Successfully');
        }

        // Import data from CSV (Replace)
        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                parseAndImportCSV(text);
                document.getElementById('csvFileInput').value = ''; // reset
            };
            reader.readAsText(file);
        }

        function parseAndImportCSV(csvText) {
            try {
                const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
                if (lines.length <= 1) {
                    showToast('Invalid CSV');
                    return;
                }

                const parseLine = (line) => {
                    const result = [];
                    let startValueIdx = 0;
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        if (line[i] === '"') {
                            inQuotes = !inQuotes;
                        } else if (line[i] === ',' && !inQuotes) {
                            result.push(line.substring(startValueIdx, i).replace(/^"|"$/g, '').replace(/""/g, '"').trim());
                            startValueIdx = i + 1;
                        }
                    }
                    result.push(line.substring(startValueIdx).replace(/^"|"$/g, '').replace(/""/g, '"').trim());
                    return result;
                };

                const newFlights = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = parseLine(lines[i]);
                    if (cols.length >= 4) {
                        const hasYear = cols.length >= 5;
                        newFlights.push({
                            id: Date.now().toString() + i + Math.random().toString(36).substr(2, 5),
                            flightNumber: cols[0],
                            date: cols[1], 
                            year: hasYear ? cols[2] : '',
                            aircraftReg: hasYear ? cols[3] : cols[2],
                            seat: hasYear ? cols[4] : cols[3]
                        });
                    }
                }

                // Overwrite
                flights = newFlights;
                saveToLocalStorage();
                renderList();
                showToast(`Replaced with ${newFlights.length} flights`);

            } catch (err) {
                console.error(err);
                showToast('Error parsing CSV');
            }
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
